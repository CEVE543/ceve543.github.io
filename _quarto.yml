# Generated by scripts/publish.jl from the instructor
# _quarto.yml. Sidebar entries for withheld pages are removed.
filters:
  - "_assets/lua/draft-banner.lua"
  - "_assets/lua/typst-columns.lua"
  - "_assets/lua/typst-stack.lua"
  - "_assets/lua/instructor-slides.lua"
  - at: "pre-ast"
    path: "_assets/lua/answer.lua"
project:
  preview:
    port: 4300
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!CLAUDE.md"
    - "!README.md"
    - "!.claude/**"
    - "!scripts/**"
    - "!_background/**"
    - "!assessments/*/rubric.md"
    - "!assessments/orals/schedule.md"
    - "!**/solutions.qmd"
    - "!**/*-solutions.qmd"
    - "!**/*-solutions/**"
    - "!**/*.csv"
  type: "website"
  resources:
    - "_assets/fonts/*.woff2"
    - "!assessments/*/rubric.md"
    - "!assessments/orals/schedule.md"
    - "!_background/**"
    - "!scripts/**"
    - "!.claude/**"
    - "!**/solutions.qmd"
    - "!**/*-solutions.qmd"
    - "!**/*-solutions/**"
format:
  html:
    code-annotations: "hover"
    code-overflow: "wrap"
    toc: true
    copy-code: true
    citations-hover: true
    callout-appearance: "simple"
    theme:
      - "spacelab"
      - "_assets/sass/custom.scss"
    grid:
      body-width: "750px"
    date-format: "dddd, MMMM D, YYYY"
    html-math-method: "mathjax"
    reference-location: "document"
    csl: "_assets/references/american-geophysical-union.csl"
    anchor-sections: true
    code-line-numbers: true
website:
  sidebar:
    search: true
    collapse-level: 1
    style: "docked"
    logo: "_assets/logos/Rice_Logo_280_Blue.svg"
    title: "CEVE 543"
    tools:
      - icon: "github"
        href: "https://www.github.com/CEVE543/ceve543.github.io"
        text: "Github Repository"
    contents:
      - href: "index.qmd"
        text: "Home"
      - href: "syllabus.qmd"
        text: "Syllabus"
      - href: "schedule.qmd"
        text: "Schedule"
      - href: "ai.qmd"
        text: "AI Policy"
      - href: "stack.qmd"
        text: "Software Reference"
      - href: "assessments/final-project/index.qmd"
        text: "Final project"
    align: "center"
  page-navigation: true
  page-footer:
    left: |
      {{< fa copyright >}} {{< var course.copyright_year >}} [{{< var instructor.name_no_title >}}]({{< var instructor.url >}}) &middot;
      {{< fa brands creative-commons >}} [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)
      
    right: |
      [{{< fa brands github >}} Source]({{< var course.github >}}) &middot;
      Built with [Julia](https://julialang.org) and [Quarto](https://quarto.org/)
      
  bread-crumbs: false
  repo-url: "https://www.github.com/CEVE543/ceve543.github.io"
  title: "CEVE 543 – Fall 2026"
  site-url: "https://ceve543.github.io/"
  description: "Homepage for {{< var course.number >}}, {{< var course.short_title >}}, at Rice University, {{< var course.semester >}}."
  repo-actions:
    - "edit"
    - "issue"
  open-graph: true
execute:
  exeflags:
    - "--project=@."
    - "--threads=auto"
  freeze: "auto"
  cache: true
bibliography: "references.bib"
echo: true
engine: "julia"
